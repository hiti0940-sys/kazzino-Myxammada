<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎰 Братик-Казино 5.0</title>
<style>
:root{--bg:#0a0a0f;--panel:#141424;--panel2:#1e1e36;--accent:#ff0055;--accent2:#7a00ff;--gold:#ffcc00;--green:#00ff88;--text:#fff;--muted:#8888a0;--glass:rgba(30,30,54,0.7);}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:14px;overflow-x:hidden;background-image:radial-gradient(circle at 50% 0%, #1e1e36 0%, #0a0a0f 60%);}
#app,#auth-screen{max-width:1000px;margin:0 auto;display:none;}

/* АВТОРИЗАЦИЯ */
#auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;}
.auth-box{background:var(--glass);backdrop-filter:blur(10px);padding:30px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 10px 40px rgba(0,0,0,0.8);width:100%;max-width:360px;}
.auth-box h1{color:var(--accent);text-align:center;margin-bottom:20px;text-shadow:0 0 15px var(--accent);}
.auth-box input{width:100%;padding:12px;margin-bottom:12px;background:rgba(0,0,0,0.5);border:1px solid var(--panel2);border-radius:10px;color:#fff;font-size:15px;outline:none;transition:.3s;}
.auth-box input:focus{border-color:var(--accent);}
.auth-box button{width:100%;padding:12px;background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px;transition:.2s;}
.auth-box button:hover{transform:scale(1.02);box-shadow:0 0 15px var(--accent);}
.auth-toggle{text-align:center;margin-top:15px;font-size:13px;color:var(--muted);cursor:pointer;}
.auth-toggle:hover{color:#fff;}

/* ШАПКА */
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(10px);padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.05);margin-bottom:12px;box-shadow:0 4px 15px rgba(0,0,0,0.5);}
.wallets{display:flex;gap:12px;font-weight:800;font-size:16px;flex-wrap:wrap;}
.c-coins{color:var(--gold);text-shadow:0 0 5px var(--gold);}
.c-gold{color:#ffaa00;}
.c-gems{color:var(--accent2);text-shadow:0 0 5px var(--accent2);}
.logout-btn{background:rgba(255,0,85,0.2);color:var(--accent);border:1px solid var(--accent);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;}

/* НАВИГАЦИЯ */
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
nav button{flex:1;min-width:85px;padding:10px 6px;background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid transparent;border-radius:10px;cursor:pointer;font-weight:700;font-size:12px;transition:.2s;}
nav button:hover{color:#fff;background:rgba(255,255,255,0.1);}
nav button.active{background:var(--accent2);color:#fff;box-shadow:0 0 15px rgba(122,0,255,0.5);}
.tab{display:none;background:var(--glass);backdrop-filter:blur(10px);padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,0.05);}
.tab.active{display:block;animation:fadeIn .3s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

h2{color:var(--accent);font-size:20px;margin-bottom:14px;text-shadow:0 0 8px rgba(255,0,85,0.5);}
label{display:block;color:var(--muted);font-size:12px;margin-top:8px;}
input[type="number"], select{width:100%;padding:10px;margin-top:4px;background:rgba(0,0,0,0.4);color:#fff;border:1px solid var(--panel2);border-radius:8px;font-size:14px;outline:none;}
button.action{width:100%;padding:12px;margin-top:12px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:1px;}
button.action:hover:not(:disabled){transform:scale(1.02);box-shadow:0 0 15px var(--accent);}
button.action:disabled{background:#333;color:#666;cursor:not-allowed;transform:none;box-shadow:none;}
.muted{color:var(--muted);font-size:12px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>*{flex:1;min-width:120px;}

/* КЕЙСЫ */
.case-strip-container{overflow:hidden;background:#000;border:2px solid var(--accent2);border-radius:10px;position:relative;height:100px;margin:20px 0;box-shadow:inset 0 0 20px #000;}
.case-strip{display:flex;gap:10px;padding:10px;position:absolute;left:0;top:0;}
.strip-item{min-width:76px;height:76px;background:var(--panel2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;border-bottom:4px solid;}
.strip-item .e{font-size:30px;margin-bottom:4px;}
.case-pointer{position:absolute;top:0;bottom:0;left:50%;width:4px;background:var(--gold);transform:translateX(-50%);z-index:10;box-shadow:0 0 10px var(--gold);}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px;}
.case-card{background:rgba(0,0,0,0.4);border:1px solid var(--panel2);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.2s;}
.case-card:hover{border-color:var(--gold);transform:translateY(-3px);}
.case-card .e{font-size:40px;display:block;margin-bottom:8px;}
.case-card .n{font-weight:800;margin-bottom:4px;}
.case-card .p{font-size:12px;color:var(--gold);font-weight:700;}

/* ИНВЕНТАРЬ */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:15px;}
.inv-item{background:rgba(0,0,0,0.5);border:1px solid var(--panel2);border-radius:10px;padding:10px;text-align:center;position:relative;}
.inv-item .e{font-size:36px;margin-bottom:5px;}
.inv-item .n{font-size:11px;font-weight:bold;}
.inv-item .r{font-size:9px;text-transform:uppercase;margin-top:3px;}
.inv-item.legendary{border-color:var(--gold);box-shadow:0 0 10px rgba(255,204,0,0.3);}
.inv-item.rare{border-color:#3b82f6;}
.inv-item.common{border-color:#555;}

/* БОИ */
.arena{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:30px 0;background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);padding:30px 20px 10px;border-radius:14px;border-bottom:4px solid var(--accent);position:relative;height:220px;}
.fighter{flex:1;text-align:center;position:relative;transition:.2s;display:flex;flex-direction:column;align-items:center;}
.fighter .avatar{font-size:70px;transition:transform .15s;display:inline-block;line-height:1;}
.fighter.punch-left .avatar{transform:translateX(40px) rotate(15deg);}
.fighter.punch-right .avatar{transform:translateX(-40px) rotate(-15deg);}
.fighter.dodge-left .avatar{transform:translateX(-30px) rotate(-10deg);}
.fighter.dodge-right .avatar{transform:translateX(30px) rotate(10deg);}
.fighter .name{font-weight:800;color:var(--gold);margin:10px 0 5px;font-size:14px;background:rgba(0,0,0,0.5);padding:2px 8px;border-radius:5px;}
.hpbar{width:100%;height:12px;background:#333;border-radius:6px;overflow:hidden;margin-top:5px;border:1px solid #000;}
.hpfill{height:100%;background:linear-gradient(90deg,var(--green),#00cc66);transition:width .3s;box-shadow:0 0 10px var(--green);}
.hit-effect{position:absolute;top:20%;left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;color:var(--accent);text-shadow:0 0 10px var(--accent);opacity:0;pointer-events:none;}
.hit-effect.show{animation:hitAnim .5s forwards;}
@keyframes hitAnim{0%{opacity:1;transform:translateX(-50%) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-40px) scale(1.5);}}

/* КРИПТА */
.crypto-chart{width:100%;height:150px;background:#000;border:1px solid #333;border-radius:10px;margin:10px 0;position:relative;overflow:hidden;}
.crypto-line{fill:none;stroke:var(--green);stroke-width:3;stroke-linejoin:round;transition:stroke .3s, points .3s;}
.crypto-price{font-size:36px;font-weight:900;color:var(--green);text-align:center;text-shadow:0 0 15px var(--green);}
.crypto-price.down{color:var(--accent);text-shadow:0 0 15px var(--accent);}

/* АДМИН ЩИТ */
.admin-panel{background:linear-gradient(135deg, rgba(122,0,255,0.2), rgba(255,0,85,0.2));border:2px solid var(--accent2);border-radius:14px;padding:20px;box-shadow:0 0 30px rgba(122,0,255,0.3);}
.admin-btn{background:rgba(0,0,0,0.5);border:1px solid var(--accent);color:#fff;padding:12px;border-radius:8px;cursor:pointer;font-weight:bold;margin-bottom:10px;width:100%;transition:.2s;}
.admin-btn:hover{background:var(--accent);}

#admin-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--gold);color:#000;padding:12px 24px;border-radius:10px;font-weight:800;z-index:2000;transition:.3s;opacity:0;box-shadow:0 0 20px var(--gold);}
#admin-toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<!-- АВТОРИЗАЦИЯ -->
<div id="auth-screen">
  <div class="auth-box">
    <h1>🎰 БРАТИК-КАЗИНО</h1>
    <input type="text" id="auth-login" placeholder="Логин" autocomplete="off">
    <input type="password" id="auth-pass" placeholder="Пароль" autocomplete="off">
    <button onclick="doLogin()">ВОЙТИ</button>
    <button onclick="doRegister()" style="background:transparent;border:1px solid var(--accent);color:var(--accent);margin-top:8px;">РЕГИСТРАЦИЯ</button>
    <div class="auth-toggle" id="auth-msg"></div>
  </div>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<div id="app">
  <header>
    <div style="font-weight:800;font-size:16px;" id="disp-nick">Игрок</div>
    <div class="wallets">
      <span class="c-coins">💰 <span id="coins">0</span></span>
      <span class="c-gold">🥇 <span id="gold">0</span></span>
      <span class="c-gems">💎 <span id="gems">0</span></span>
    </div>
    <button class="logout-btn" onclick="logout()">ВЫЙТИ</button>
  </header>

  <nav id="main-nav">
    <button data-tab="cases" class="active">🎁 Кейсы</button>
    <button data-tab="inventory">🎒 Инвентарь</button>
    <button data-tab="crash">📈 Краш</button>
    <button data-tab="crypto">₿ Крипта</button>
    <button data-tab="fight">🥊 Бои</button>
    <button data-tab="admin" id="nav-admin" style="display:none; color:var(--gold); border:1px solid var(--gold);">🛡 Щит</button>
  </nav>

  <!-- КЕЙСЫ -->
  <section id="cases" class="tab active">
    <h2>🎁 Открытие Кейсов</h2>
    <div class="case-strip-container">
      <div class="case-pointer"></div>
      <div class="case-strip" id="case-strip"></div>
    </div>
    <div id="case-result" style="text-align:center;font-weight:800;font-size:18px;min-height:25px;color:var(--green);"></div>
    <div class="cases-grid" id="cases-grid"></div>
  </section>

  <!-- ИНВЕНТАРЬ -->
  <section id="inventory" class="tab">
    <h2>🎒 Твой Инвентарь</h2>
    <p class="muted">Здесь хранятся твои скины и подарки. Выбивай их из кейсов!</p>
    <div class="inv-grid" id="inv-grid">
      <div class="muted" style="grid-column: 1/-1; text-align:center; padding:20px;">Инвентарь пуст...</div>
    </div>
  </section>

  <!-- КРАШ -->
  <section id="crash" class="tab">
    <h2>📈 Краш</h2>
    <div style="text-align:center;padding:30px;background:rgba(0,0,0,0.6);border-radius:14px;border:1px solid #333;">
      <div id="crash-mult" style="font-size:60px;font-weight:900;color:var(--green);transition:color .2s;">1.00×</div>
      <div id="crash-status" class="muted" style="margin-top:10px;font-size:14px;">Готов к старту</div>
    </div>
    <div class="row" style="margin-top:15px;">
      <div><label>Ставка (💰)</label><input type="number" id="cr-bet" value="100"></div>
    </div>
    <button class="action" id="cr-start">🚀 СТАРТ</button>
    <button class="action" id="cr-cash" style="display:none;background:linear-gradient(90deg,#00ff88,#00cc66);color:#000;">💵 ЗАБРАТЬ НА <span id="cash-mult">1.00×</span></button>
    <div id="cr-result" style="text-align:center;margin-top:10px;font-weight:700;"></div>
  </section>

  <!-- КРИПТА -->
  <section id="crypto" class="tab">
    <h2>₿ Рынок Крипты</h2>
    <div class="crypto-price" id="btc-price">$60,000</div>
    <div class="crypto-chart">
      <svg id="btc-svg" width="100%" height="100%" preserveAspectRatio="none">
        <polyline id="btc-line" class="crypto-line" points="" />
      </svg>
    </div>
    <div class="row">
      <div><label>Твой BTC</label><div style="font-size:20px;font-weight:800;padding:5px 0;" id="my-btc">0.0000</div></div>
      <div><label>Твой USD (💰)</label><div style="font-size:20px;font-weight:800;padding:5px 0;color:var(--gold);" id="my-usd">0</div></div>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="action" style="margin-top:0;background:linear-gradient(90deg,#00ff88,#00cc66);color:#000;" onclick="tradeCrypto('buy')">КУПИТЬ</button>
      <button class="action" style="margin-top:0;background:linear-gradient(90deg,#ff0055,#cc0044);" onclick="tradeCrypto('sell')">ПРОДАТЬ</button>
    </div>
    <div style="margin-top:10px;"><label>Сумма (в 💰)</label><input type="number" id="crypto-amount" value="100"></div>
  </section>

  <!-- БОИ -->
  <section id="fight" class="tab">
    <h2>🥊 Боксёрский Ринг</h2>
    <div class="arena">
      <div class="fighter" id="f-left">
        <div class="hit-effect" id="fx-left"></div>
        <div class="avatar">🥊</div>
        <div class="name" id="f-l-name">Игрок</div>
        <div class="hpbar"><div class="hpfill" id="f-l-hp" style="width:100%;"></div></div>
      </div>
      <div style="font-size:24px;font-weight:900;color:var(--accent);margin-bottom:40px;">VS</div>
      <div class="fighter" id="f-right">
        <div class="hit-effect" id="fx-right"></div>
        <div class="avatar">🥊</div>
        <div class="name" id="f-r-name">Соперник</div>
        <div class="hpbar"><div class="hpfill" id="f-r-hp" style="width:100%;background:linear-gradient(90deg,var(--accent),#cc0044);"></div></div>
      </div>
    </div>
    <div class="row">
      <div><label>Ставка (💰)</label><input type="number" id="f-bet" value="100"></div>
      <div><label>На кого</label><select id="f-side"><option value="left">Левый (Ты)</option><option value="right">Правый</option></select></div>
    </div>
    <button class="action" id="f-play">В БОЙ (×2)</button>
    <div id="f-result" style="text-align:center;margin-top:10px;font-weight:700;min-height:25px;"></div>
  </section>

  <!-- АДМИН -->
  <section id="admin" class="tab">
    <h2>🛡 Щит Панель</h2>
    <div class="admin-panel">
      <p class="muted" style="margin-bottom:15px;color:var(--gold);">Доступ только для Админа.</p>
      <button class="admin-btn" onclick="ADMIN.addCoins(1000000)">💰 +1,000,000 Монет</button>
      <button class="admin-btn" onclick="ADMIN.addGold(1000)">🥇 +1000 Золота</button>
      <button class="admin-btn" onclick="ADMIN.addGems(500)">💎 +500 Гемов</button>
      <button class="admin-btn" onclick="ADMIN.dropKnife()">🔪 Выдать Керамбит</button>
      <button class="admin-btn" style="border-color:var(--accent); color:var(--accent);" onclick="localStorage.clear();location.reload();">🗑 ПОЛНЫЙ СБРОС СЕРВЕРА</button>
    </div>
  </section>

</div>

<div id="admin-toast"></div>

<script>
// ================= БАЗА ДАННЫХ =================
let DB = JSON.parse(localStorage.getItem('bratik_users_v5')) || {};
let currentUser = sessionStorage.getItem('bratik_active') || null;
let S = null; // Ссылка на текущего юзера
let cryptoInt = null;

function saveDB() {
  localStorage.setItem('bratik_users_v5', JSON.stringify(DB));
}
function saveUser() {
  if (S) { DB[S.login] = S; saveDB(); }
}

// ================= АВТОРИЗАЦИЯ =================
function showMsg(text, isError) {
  const el = document.getElementById('auth-msg');
  el.textContent = text;
  el.style.color = isError ? 'var(--accent)' : 'var(--green)';
}

function doRegister() {
  const login = document.getElementById('auth-login').value.trim();
  const pass = document.getElementById('auth-pass').value.trim();
  if (!login || !pass) return showMsg('Заполни все поля!', true);
  if (login === 'Admin') return showMsg('Ник Admin зарезервирован!', true);
  if (DB[login]) return showMsg('Такой ник уже есть!', true);
  
  DB[login] = {
    login: login, pass: pass, role: 'user',
    coins: 1000, gold: 0, gems: 0, btc: 0, btcPrice: 60000, btcHistory: [60000],
    inventory: []
  };
  saveDB();
  showMsg('Успешно! Теперь войди.', false);
}

function doLogin() {
  const login = document.getElementById('auth-login').value.trim();
  const pass = document.getElementById('auth-pass').value.trim();
  
  // Секретный админ
  if (login === 'Admin' && pass === 'admin123') {
    if (!DB['Admin']) {
      DB['Admin'] = { login: 'Admin', pass: 'admin123', role: 'admin', coins: 999999, gold: 999, gems: 999, btc: 0, btcPrice: 60000, btcHistory: [60000], inventory: [] };
      saveDB();
    }
  }

  if (!DB[login] || DB[login].pass !== pass) return showMsg('Неверный логин или пароль!', true);
  
  currentUser = login;
  sessionStorage.setItem('bratik_active', login);
  loadGame();
}

function logout() {
  sessionStorage.removeItem('bratik_active');
  location.reload();
}

function loadGame() {
  S = DB[currentUser];
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  
  if (S.role === 'admin') {
    document.getElementById('nav-admin').style.display = 'block';
    document.getElementById('disp-nick').innerHTML = '👑 ' + S.login;
    document.getElementById('disp-nick').style.color = 'var(--gold)';
  } else {
    document.getElementById('disp-nick').textContent = '👤 ' + S.login;
  }
  
  renderAll();
  initCrypto();
}

// ================= ОБЩЕЕ =================
function renderAll() {
  document.getElementById('coins').textContent = Math.floor(S.coins);
  document.getElementById('gold').textContent = S.gold;
  document.getElementById('gems').textContent = S.gems;
  document.getElementById('my-usd').textContent = Math.floor(S.coins);
  document.getElementById('my-btc').textContent = S.btc.toFixed(4);
  renderInventory();
  saveUser();
}

function toast(msg) {
  const t = document.getElementById('admin-toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t.timer);
  t.timer = setTimeout(() => t.classList.remove('show'), 2000);
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  };
});

// ================= ИНВЕНТАРЬ И КЕЙСЫ =================
const SKINS = [
  { e: '🔪', n: 'Керамбит', r: 'legendary', c: '#ffcc00' },
  { e: '🗡️', n: 'Бабочка', r: 'legendary', c: '#ffcc00' },
  { e: '🔫', n: 'AK-47 Огонь', r: 'rare', c: '#3b82f6' },
  { e: '🔫', n: 'AWP Азимов', r: 'rare', c: '#3b82f6' },
  { e: '🧸', n: 'Мишка ТГ', r: 'common', c: '#888' },
  { e: '🌹', n: 'Роза ТГ', r: 'common', c: '#888' },
  { e: '🚀', n: 'Ракета ТГ', r: 'rare', c: '#3b82f6' }
];

const CASES = {
  common: { name: 'Обычный', emoji: '📦', cost: 100, color: '#888', loot: [
    { e: '💰', l: '+150', w: 40, r: '#888', type: 'coins', val: 150 },
    { e: '💰', l: '+300', w: 30, r: '#888', type: 'coins', val: 300 },
    { e: '🧸', l: 'Мишка ТГ', w: 20, r: '#888', type: 'item', item: SKINS[4] },
    { e: '🌹', l: 'Роза ТГ', w: 10, r: '#888', type: 'item', item: SKINS[5] }
  ]},
  rare: { name: 'Редкий', emoji: '🎁', cost: 500, color: '#3b82f6', loot: [
    { e: '💰', l: '+600', w: 30, r: '#888', type: 'coins', val: 600 },
    { e: '🔫', l: 'AK-47', w: 25, r: '#3b82f6', type: 'item', item: SKINS[2] },
    { e: '🚀', l: 'Ракета ТГ', w: 20, r: '#3b82f6', type: 'item', item: SKINS[6] },

    { e: '🔪', l: 'Керамбит', w: 30, r: '#ffcc00', type: 'item', item: SKINS[0] },
    { e: '🗡️', l: 'Бабочка', w: 25, r: '#ffcc00', type: 'item', item: SKINS[1] },
    { e: '🔫', l: 'AWP', w: 25, r: '#3b82f6', type: 'item', item: SKINS[3] },
    { e: '💎', l: '+5', w: 15, r: '#7a00ff', type: 'gems', val: 5 },
    { e: '💰', l: '+10000', w: 5, r: '#888', type: 'coins', val: 10000 }
  ]}
};

function renderCases() {
  const grid = document.getElementById('cases-grid');
  grid.innerHTML = '';
  for (let k in CASES) {
    const c = CASES[k];
    let div = document.createElement('div');
    div.className = 'case-card';
    div.innerHTML = `<span class="e">${c.emoji}</span><div class="n" style="color:${c.color}">${c.name}</div><div class="p">${c.cost} 💰</div>`;
    div.onclick = () => openCase(k);
    grid.appendChild(div);
  }
}

async function openCase(caseId) {
  if (!S) return;
  const c = CASES[caseId];
  if (S.coins < c.cost) return toast('❌ Мало монет!');
  S.coins -= c.cost; renderAll();

  const strip = document.getElementById('case-strip');
  const result = document.getElementById('case-result');
  strip.style.transition = 'none';
  strip.style.left = '0px';
  strip.innerHTML = '';
  result.textContent = '';

  const items = [];
  for (let i = 0; i < 50; i++) {
    const totalW = c.loot.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * totalW, picked = c.loot[0];
    for (let it of c.loot) { r -= it.w; if (r <= 0) { picked = it; break; } }
    items.push(picked);
  }
  const winItem = items[45];

  items.forEach(item => {
    let el = document.createElement('div');
    el.className = 'strip-item';
    el.style.borderColor = item.r;
    el.innerHTML = `<div class="e">${item.e}</div><div>${item.l}</div>`;
    strip.appendChild(el);
  });

  await new Promise(r => setTimeout(r, 50));
  const targetLeft = -(45 * 86) + (strip.parentElement.clientWidth / 2) - 38;
  strip.style.transition = 'left 4s cubic-bezier(0.15, 0.85, 0.35, 1)';
  strip.style.left = targetLeft + 'px';

  setTimeout(() => {
    result.textContent = `Ты выбил: ${winItem.e} ${winItem.l}`;
    result.style.color = winItem.r;
    
    if (winItem.type === 'coins') S.coins += winItem.val;
    if (winItem.type === 'gold') S.gold += winItem.val;
    if (winItem.type === 'gems') S.gems += winItem.val;
    if (winItem.type === 'item') {
      S.inventory.push({ ...winItem.item, id: Date.now() });
      renderInventory();
    }
    renderAll();
  }, 4100);
}

function renderInventory() {
  const grid = document.getElementById('inv-grid');
  grid.innerHTML = '';
  if (!S.inventory || S.inventory.length === 0) {
    grid.innerHTML = '<div class="muted" style="grid-column: 1/-1; text-align:center; padding:20px;">Инвентарь пуст...</div>';
    return;
  }
  // Показываем новые сверху
  [...S.inventory].reverse().forEach(item => {
    let div = document.createElement('div');
    div.className = 'inv-item ' + item.r;
    div.innerHTML = `<div class="e">${item.e}</div><div class="n">${item.n}</div><div class="r" style="color:${item.c}">${item.r}</div>`;
    grid.appendChild(div);
  });
}

// ================= БОЙ (JAB, DODGE) =================
let isFighting = false;
async function startFight() {
  if (isFighting) return;
  const bet = parseInt(document.getElementById('f-bet').value);
  const side = document.getElementById('f-side').value;
  if (isNaN(bet) || bet < 10 || bet > S.coins) return toast('❌ Неверная ставка');
  
  isFighting = true;
  S.coins -= bet; renderAll();
  
  const btn = document.getElementById('f-play');
  btn.disabled = true;
  const res = document.getElementById('f-result');
  res.textContent = 'Бой начался!';
  res.style.color = 'var(--gold)';
  
  let lHp = 100, rHp = 100;
  const lBar = document.getElementById('f-l-hp');
  const rBar = document.getElementById('f-r-hp');
  lBar.style.width = '100%'; rBar.style.width = '100%';
  
  const leftEl = document.getElementById('f-left');
  const rightEl = document.getElementById('f-right');
  const fxLeft = document.getElementById('fx-left');
  const fxRight = document.getElementById('fx-right');

  while (lHp > 0 && rHp > 0) {
    // Атака левого
    leftEl.classList.add('punch-left');
    await new Promise(r => setTimeout(r, 150));
    
    if (Math.random() < 0.3) { // Уклонение правого
      rightEl.classList.add('dodge-right');
      fxRight.textContent = 'DODGE!';
      fxRight.style.color = 'var(--gold)';
      fxRight.classList.add('show');
    } else {
      const dmg = 10 + Math.floor(Math.random() * 15);
      rHp -= dmg;
      rBar.style.width = Math.max(0, rHp) + '%';
      fxRight.textContent = '-' + dmg + ' JAB!';
      fxRight.style.color = 'var(--accent)';
      fxRight.classList.add('show');
    }
    await new Promise(r => setTimeout(r, 350));
    leftEl.classList.remove('punch-left');
    rightEl.classList.remove('dodge-right');
    fxRight.classList.remove('show');
    if (rHp <= 0) break;

    // Атака правого
    rightEl.classList.add('punch-right');
    await new Promise(r => setTimeout(r, 150));
    
    if (Math.random() < 0.3) {
      leftEl.classList.add('dodge-left');
      fxLeft.textContent = 'DODGE!';
      fxLeft.style.color = 'var(--gold)';
      fxLeft.classList.add('show');
    } else {
      const dmg = 10 + Math.floor(Math.random() * 15);
      lHp -= dmg;
      lBar.style.width = Math.max(0, lHp) + '%';
      fxLeft.textContent = '-' + dmg + ' HIT!';
      fxLeft.style.color = 'var(--accent)';
      fxLeft.classList.add('show');
    }
    await new Promise(r => setTimeout(r, 350));
    rightEl.classList.remove('punch-right');
    leftEl.classList.remove('dodge-left');
    fxLeft.classList.remove('show');
  }

  const winner = rHp <= 0 ? 'left' : 'right';
  if (winner === side) {
    S.coins += bet * 2;
    res.textContent = `🏆 Ты победил! Выигрыш: ${bet * 2} 💰`;
    res.style.color = 'var(--green)';
  } else {
    res.textContent = `💀 Ты проиграл. Потеряно: ${bet} 💰`;
    res.style.color = 'var(--accent)';
  }
  renderAll();
  isFighting = false;
  btn.disabled = false;
}
document.getElementById('f-play').onclick = startFight;

// ================= КРАШ =================
let isCrashed = false, crashInt = null, crashMult = 1, crashBet = 0;
document.getElementById('cr-start').onclick = () => {
  if (isCrashed) return;
  const bet = parseInt(document.getElementById('cr-bet').value);
  if (isNaN(bet) || bet < 10 || bet > S.coins) return toast('❌ Неверная ставка');
  
  S.coins -= bet; renderAll();
  isCrashed = true; crashMult = 1; crashBet = bet;
  const crashPoint = Math.max(1.1, 0.99 / (1 - Math.random()));
  
  document.getElementById('cr-start').style.display = 'none';
  document.getElementById('cr-cash').style.display = 'block';
  document.getElementById('cr-result').textContent = '';
  
  const multEl = document.getElementById('crash-mult');
  multEl.style.color = 'var(--green)';
  
  crashInt = setInterval(() => {
    crashMult += 0.05 + (crashMult * 0.01);
    if (crashMult >= crashPoint) {
      clearInterval(crashInt); isCrashed = false;
      multEl.style.color = 'var(--accent)';
      multEl.textContent = crashPoint.toFixed(2) + '×';
      document.getElementById('crash-status').textContent = '💥 КРАШ!';
      document.getElementById('cr-result').textContent = `Ты потерял ${bet} 💰`;
      document.getElementById('cr-result').style.color = 'var(--accent)';
      document.getElementById('cr-start').style.display = 'block';
      document.getElementById('cr-cash').style.display = 'none';
    } else {
      multEl.textContent = crashMult.toFixed(2) + '×';
      document.getElementById('cash-mult').textContent = crashMult.toFixed(2) + '×';
    }
  }, 50);
};
document.getElementById('cr-cash').onclick = () => {
  if (!isCrashed) return;
  clearInterval(crashInt); isCrashed = false;
  const payout = Math.floor(crashBet * crashMult);
  S.coins += payout; renderAll();
  document.getElementById('cr-result').textContent = `Ты забрал ${payout} 💰 (×${crashMult.toFixed(2)})`;
  document.getElementById('cr-result').style.color = 'var(--green)';
  document.getElementById('cr-start').style.display = 'block';
  document.getElementById('cr-cash').style.display = 'none';
  document.getElementById('crash-status').textContent = 'Забрал!';
};

// ================= КРИПТА =================
function initCrypto() {
  clearInterval(cryptoInt);
  cryptoInt = setInterval(() => {
    let change = (Math.random() - 0.5) * 2000;
    if (Math.random() < 0.05) change = 10000;
    if (Math.random() < 0.05) change = -10000;
    S.btcPrice = Math.max(1000, S.btcPrice + change);
    S.btcHistory.push(S.btcPrice);
    if (S.btcHistory.length > 30) S.btcHistory.shift();
    
    document.getElementById('btc-price').textContent = '$' + Math.floor(S.btcPrice).toLocaleString();
    document.getElementById('btc-price').className = 'crypto-price ' + (change < 0 ? 'down' : '');
    
    const max = Math.max(...S.btcHistory), min = Math.min(...S.btcHistory);
    const range = max - min || 1;
    let points = S.btcHistory.map((p, i) => {
      const x = (i / (S.btcHistory.length - 1)) * 100;
      const y = 100 - ((p - min) / range) * 80 - 10;
      return `${x}%,${y}%`;
    }).join(' ');
    document.getElementById('btc-line').setAttribute('points', points);
    document.getElementById('btc-line').style.stroke = change < 0 ? 'var(--accent)' : 'var(--green)';
    saveUser();
  }, 1000);
}
function tradeCrypto(type) {
  const amount = parseInt(document.getElementById('crypto-amount').value);
  if (isNaN(amount) || amount <= 0) return toast('Введи сумму');
  if (type === 'buy') {
    if (S.coins < amount) return toast('Мало монет');
    const btcBought = amount / S.btcPrice;
    S.btc += btcBought; S.coins -= amount;
    toast(`Куплено ${btcBought.toFixed(4)} BTC`);
  } else {
    const btcToSell = amount / S.btcPrice;
    if (S.btc < btcToSell) return toast('Мало BTC');
    S.btc -= btcToSell; S.coins += amount;
    toast(`Продано ${btcToSell.toFixed(4)} BTC`);
  }
  renderAll();
}

};
